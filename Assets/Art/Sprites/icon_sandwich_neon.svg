<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glowWhite" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Sandwich Bread Triangle (White Line Art) -->
  <path d="M40 150 L150 40 L165 75 L55 185 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowWhite)"/>
  <path d="M50 135 L145 55" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Green Lettuce Wavy line -->
  <path d="M60 148 C75 125 90 140 105 115 C120 90 135 105 150 80" fill="none" stroke="#00ff66" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Meat / Ham layer -->
