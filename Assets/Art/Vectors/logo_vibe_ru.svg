<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <filter id="neonGlowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="160" fill="#0e061e" rx="16"/>
  <!-- Outer Neon Border -->
  <rect x="20" y="20" width="360" height="120" rx="20" fill="none" stroke="#ff007f" stroke-width="8" filter="url(#neonGlowPink)"/>
  <rect x="20" y="20" width="360" height="120" rx="20" fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- Text "ВАЙБ" -->
  <text x="200" y="102" font-family="'Orbitron', 'Russo One', Impact, sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="middle" letter-spacing="6" filter="url(#neonGlowPink)">ВАЙБ</text>
  <text x="200" y="102" font-family="'Orbitron', 'Russo One', Impact, sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="middle" letter-spacing="6">ВАЙБ</text>
</svg>