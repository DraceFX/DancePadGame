<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glowYellow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Top Bun -->
  <path d="M40 90 C40 50 65 30 100 30 C135 30 160 50 160 90 Z" fill="none" stroke="#ffe600" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowYellow)"/>
